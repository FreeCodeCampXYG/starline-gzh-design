interface:
  display_name: "Starline GZH Design"
  author: "墨点星痕 (starline)"
  short_description: "AI 原生公众号内容与视觉编排：直接编辑、选区改写、差异审阅、简历信息模块与可校验技术图"
  default_prompt: "Use $starline-gzh-design as an AI-native WeChat content and visual workbench. Normalize the source, identify the reader's job, preserve user facts, and let the user edit blocks directly. For AI changes, target an explicit selection and show before/after with accept, reject, partial-keep, and reversible history; never silently overwrite. For diagrams, use the installed fireworks-tech-graph workflow to structure, validate, render, and retain editable source data. Reuse confirmed public identity, select a registered theme, validate paste-safe HTML to zero errors and warnings, and generate a browser preview."
  examples:
    - "用 starline-gzh-design 把这篇 Markdown 排成公众号 HTML"
    - "直接用科技钴蓝主题一键排版这篇文章"
    - "先标注再排版，确认后生成公众号 HTML"
    - "把本地图片上传图床后排版，并生成可复制预览页"
    - "选中这一段，让 AI 改得更有说服力，但先给我看差异"
    - "把这篇文章的产品流程做成可编辑的 fireworks SVG 并嵌入公众号"
    - "把我的经历整理成公众号里的简历信息模块，不要虚构内容"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "agent-skills-compatible"
  activation:
    mode: "manual-or-description"
    paths: []
  execution:
    context: "inline"
    shell: "powershell-or-bash"
  trust:
    source_tier: "local-enhanced-upstream"
    remote_inline_execution: "forbid"
    generated_public_claims: "evidence-bound"
  permissions:
    network: "optional image-host upload and WeChat draft API only when configured and requested"
    file_write: "article HTML, preview files, annotated Markdown, project DEV_STATE publishing profile, and local upload cache"
    subprocess: "bundled Python normalization, upload, validation, minification, and preview scripts"
    interactive: "theme confirmation unless automatic layout is requested; one-time public author identity confirmation when project DEV_STATE is incomplete"
  degradation:
    openai: "canonical-source"
    claude: "canonical-source"
    generic: "instruction-compatible"
    agent-skills-compatible: "canonical-source"
